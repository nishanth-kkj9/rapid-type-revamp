    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Typing Trainer Pro",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript and HTML5 IndexedDB/LocalStorage",
        "description": "Local-first typing trainer with timed drills, word quotas, literary quotes, Word Shooter arcade mode, per-key speed and accuracy heatmaps, and offline PWA support.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "Timed, Word Quota, Quote, and Custom Text typing drills",
          "Keystroke-level accuracy and rolling WPM analytics",
          "Word Shooter arcade typing game",
          "QWERTY, Dvorak, Colemak, QWERTZ, and AZERTY layouts",
          "Per-key accuracy and latency heatmap",
          "100% browser-local storage with offline PWA support"
        ]
      }
    </script>
    <script>
      try {
        var root = document.documentElement;
        var theme = localStorage.getItem("ttp:theme:v1");
        if (theme !== "dark" && theme !== "light" && theme !== "high-contrast") {
          if (window.matchMedia && window.matchMedia("(prefers-contrast: more)").matches) {
            theme = "high-contrast";
          } else if (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches
          ) {
            theme = "light";
          } else {
            theme = "dark";
          }
        }
        root.classList.toggle("light", theme === "light");
        root.classList.toggle("high-contrast", theme === "high-contrast");
        root.dataset.theme = theme;
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) {
          themeMeta.setAttribute(
            "content",
            theme === "light" ? "#f8f7f4" : theme === "high-contrast" ? "#000000" : "#1c1917",
          );
        }

        var prefsRaw = localStorage.getItem("ttp:uiprefs:v1");
        if (prefsRaw) {
          var prefs = JSON.parse(prefsRaw);
          if (prefs && prefs.themeAccent) root.dataset.accent = prefs.themeAccent;
          if (prefs && prefs.dyslexiaFont) root.dataset.font = "opendyslexic";
        }

        var origin = window.location.origin;
        var canonical = document.querySelector('link[rel="canonical"]');
        if (canonical) canonical.setAttribute("href", origin + window.location.pathname);
        var ogUrl = document.querySelector('meta[property="og:url"]');
        if (ogUrl) ogUrl.setAttribute("content", origin + window.location.pathname);
        var ogImg = document.querySelector('meta[property="og:image"]');
        if (ogImg) ogImg.setAttribute("content", origin + "/og-image.png");
        var twImg = document.querySelector('meta[name="twitter:image"]');
        if (twImg) twImg.setAttribute("content", origin + "/og-image.png");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
