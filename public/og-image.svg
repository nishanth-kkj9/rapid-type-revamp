<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <path d="M0 70 H1200 M0 140 H1200 M0 210 H1200 M0 280 H1200 M0 350 H1200 M0 420 H1200 M0 490 H1200 M0 560 H1200" />
    <path d="M100 0 V630 M200 0 V630 M300 0 V630 M400 0 V630 M500 0 V630 M600 0 V630 M700 0 V630 M800 0 V630 M900 0 V630 M1000 0 V630 M1100 0 V630" />
  </g>

  <!-- Accent Glow -->
  <circle cx="950" cy="200" r="160" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
  <circle cx="250" cy="450" r="180" fill="#818cf8" opacity="0.08" filter="url(#glow)" />

  <!-- Decorative Keycaps -->
  <g transform="translate(820, 160)">
    <rect x="0" y="0" width="70" height="70" rx="14" fill="#27272a" stroke="#3f3f46" stroke-width="2" />
    <text x="35" y="44" fill="#38bdf8" font-family="monospace" font-size="24" font-weight="bold" text-anchor="middle">W</text>

    <rect x="80" y="0" width="70" height="70" rx="14" fill="#27272a" stroke="#3f3f46" stroke-width="2" />
    <text x="115" y="44" fill="#a1a1aa" font-family="monospace" font-size="24" font-weight="bold" text-anchor="middle">P</text>

    <rect x="160" y="0" width="70" height="70" rx="14" fill="#27272a" stroke="#3f3f46" stroke-width="2" />
    <text x="195" y="44" fill="#a1a1aa" font-family="monospace" font-size="24" font-weight="bold" text-anchor="middle">M</text>

    <rect x="40" y="80" width="150" height="60" rx="14" fill="#27272a" stroke="#38bdf8" stroke-width="2" />
    <text x="115" y="118" fill="#38bdf8" font-family="monospace" font-size="18" font-weight="bold" text-anchor="middle">SPACE</text>
  </g>

  <!-- Brand / Title -->
  <g transform="translate(120, 240)">
    <!-- Badge -->
    <rect x="0" y="0" width="220" height="36" rx="18" fill="#27272a" stroke="#3f3f46" stroke-width="1.5" />
    <circle cx="20" cy="18" r="5" fill="#38bdf8" />
    <text x="36" y="24" fill="#e4e4e7" font-family="sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">LOCAL-FIRST TRAINER</text>

    <!-- Main Title -->
    <text x="0" y="90" fill="#f4f4f5" font-family="sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">
      Typing<tspan fill="#38bdf8">Trainer</tspan>Pro
    </text>

    <!-- Subtitle -->
    <text x="0" y="145" fill="#a1a1aa" font-family="sans-serif" font-size="24" font-weight="400">
      The typing trainer that actually diagnoses you.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 195)">
      <text x="0" y="0" fill="#71717a" font-family="monospace" font-size="16">
        Timed Drills  •  Word Shooter Arcade  •  Per-Key Heatmap  •  Targeted Weak-Key Remediation
      </text>
    </g>
  </g>
</svg>
